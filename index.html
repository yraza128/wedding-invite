<script>
/* ============ SETTINGS ============ */
const HOST_WHATSAPP = '';   
const SHEETS_URL    = 'https://script.google.com/macros/s/AKfycbyYtOrGh-Z3X1WT1kfvCa7uD6NncBoyAxHEPAaGd3Daro9C4x1xOvEcGAcJFyS7duM/exec';   
const MUSIC_URL     = '';   
/* ================================== */

const EVENTS = {
  m:{name:'Mehandi Ceremony',start:'2026-11-10T17:30:00+05:00',end:'2026-11-10T21:30:00+05:00',loc:'Garrison Officers Mess, Mall Road, Rawalpindi'},
  b:{name:'Baraat',           start:'2026-11-11T10:30:00+05:00',end:'2026-11-11T15:00:00+05:00',loc:'House 279/6-F, Mohalla Kamalabad-3, Rawalpindi'},
  w:{name:'Walima Reception',start:'2026-11-12T12:30:00+05:00',end:'2026-11-12T16:00:00+05:00',loc:'Garrison Officers Mess, Mall Road, Rawalpindi'}
};
const $ = s => document.querySelector(s);

/* ---------- Read Guest Link & Hide Unselected Events ---------- */
const P = new URLSearchParams(location.hash.slice(1));
let guest = (P.get('guest') || P.get('g') || '').trim();
let allowed = new Set();

if (P.get('e')) { 
  [...P.get('e').toLowerCase()].forEach(c => allowed.add(c)); 
} else if (P.get('m') !== null || P.get('b') !== null || P.get('w') !== null) {
  ['m','b','w'].forEach(k => { if (P.get(k) === '1') allowed.add(k); });
} else { 
  ['m','b','w'].forEach(k => allowed.add(k)); // Default: show all if no hash
}

// Remove cards that are not allowed for this specific guest
document.querySelectorAll('.card').forEach(c => { 
  if (!allowed.has(c.dataset.key)) c.remove(); 
});

if (guest) {
  $('#introName').textContent = guest;
  $('#helloLine').textContent = 'Dear ' + guest;
  $('#rName').value = guest;
  document.title = 'Invitation for ' + guest;
}
const shown = [...allowed].filter(k => EVENTS[k]).sort((a,b)=>'mbw'.indexOf(a)-'mbw'.indexOf(b));
if (shown.length === 1) $('#eventsTitle').textContent = '✦ Your Invitation ✦';

/* ---------- Auto-open Intro ---------- */
let opened = false;
function openInvite(){
  if (opened) return; opened = true;
  $('#env').classList.add('open');
  setTimeout(() => {
    $('#intro').classList.add('gone');
    document.body.classList.remove('locked');
    $('#main').classList.add('show');
    window.scrollTo(0,0);
    burst();
    tryMusic();
  }, 1700);
}
setTimeout(openInvite, 2600);
$('#intro').addEventListener('click', openInvite);

/* ---------- Reveal on Scroll ---------- */
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }), {threshold:.12});
document.querySelectorAll('.card,.rsvp').forEach(el => io.observe(el));

/* ---------- Live Countdown ---------- */
function tick(){
  const now = Date.now();
  const next = shown.map(k => ({k, t:new Date(EVENTS[k].start).getTime()})).find(x => x.t > now);
  if (!next){ $('#cd').style.display='none'; $('#cdLabel').textContent = 'Alhamdulillah – thank you for being part of our joy 🤍'; return; }
  $('#cdLabel').textContent = 'Counting down to ' + EVENTS[next.k].name;
  let s = Math.floor((next.t - now)/1000);
  const d = Math.floor(s/86400); s%=86400; const h = Math.floor(s/3600); s%=3600; const m = Math.floor(s/60); s%=60;
  const pad = n => String(n).padStart(2,'0');
  $('#cdD').textContent = pad(d); $('#cdH').textContent = pad(h); $('#cdM').textContent = pad(m); $('#cdS').textContent = pad(s);
}
tick(); setInterval(tick, 1000);

/* ---------- Add to Calendar (.ics) ---------- */
document.querySelectorAll('[data-ics]').forEach(b => b.addEventListener('click', () => {
  const ev = EVENTS[b.dataset.ics];
  const f = iso => new Date(iso).toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Wedding Invitation//EN','BEGIN:VEVENT',
    'UID:'+b.dataset.ics+'-yasir-wedding-2026@invite','DTSTAMP:'+f(new Date()),'DTSTART:'+f(ev.start),'DTEND:'+f(ev.end),
    'SUMMARY:'+ev.name+' – Major Yasir Raza','LOCATION:'+ev.loc,'DESCRIPTION:Wedding festivities of Major Yasir Raza. Hosts: Mr. & Mrs. Mulazim Hussain',
    'BEGIN:VALARM','TRIGGER:-PT3H','ACTION:DISPLAY','DESCRIPTION:Reminder','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));
  a.download = ev.name.replace(/\s+/g,'-')+'.ics'; document.body.appendChild(a); a.click(); a.remove();
}));

/* ---------- RSVP ---------- */
function rsvp(status){
  const name = $('#rName').value.trim() || guest || 'A guest';
  const wish = $('#rWish').value.trim();
  const evs = shown.map(k => EVENTS[k].name).join(', ');
  const text = status === 'yes'
    ? `Assalam-o-Alaikum! This is ${name}. We will, InshaAllah, be attending: ${evs}. 🤍` + (wish ? `\n\n"${wish}"` : '')
    : `Assalam-o-Alaikum! This is ${name}. Unfortunately we are unable to attend, but we are sending our duas and best wishes. 🤍` + (wish ? `\n\n"${wish}"` : '');
  if (SHEETS_URL) fetch(SHEETS_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({name,events:evs,status,wishes:wish})}).catch(()=>{});
  $('#thanks').style.display = 'block';
  if (status === 'yes') burst();
  window.open('https://wa.me/' + HOST_WHATSAPP + '?text=' + encodeURIComponent(text), '_blank');
}
$('#btnYes').onclick = () => rsvp('yes');
$('#btnNo').onclick  = () => rsvp('no');

/* ---------- Background FX ---------- */
const cv = $('#fx'), cx = cv.getContext('2d');
let W, H, parts = [];
function size(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', size); size();
const COUNT = Math.min(46, Math.floor(innerWidth/22));
function mk(initial){
  const petal = Math.random() < .55;
  return {petal, x:Math.random()*W, y: initial ? Math.random()*H : -20, r: petal ? 5+Math.random()*6 : 1+Math.random()*2,
    vy:.35+Math.random()*.9, vx:(Math.random()-.5)*.5, a:Math.random()*6.28, va:(Math.random()-.5)*.03, sw:Math.random()*6.28,
    col: petal ? ['#e0566b','#f08a9b','#ffc2cc','#d93a55'][Math.floor(Math.random()*4)] : '#f6e3a8'};
}
for (let i=0;i<COUNT;i++) parts.push(mk(true));
let bursts = [];
function burst(){ for (let i=0;i<70;i++){ const a=Math.random()*6.28, s=2+Math.random()*6;
  bursts.push({x:W/2,y:H*.45,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,col:Math.random()<.5?'#f6e3a8':'#e0566b',r:2+Math.random()*3}); } }
function frame(t){
  cx.clearRect(0,0,W,H);
  parts.forEach((p,i) => {
    p.y += p.vy; p.sw += .02; p.x += p.vx + Math.sin(p.sw)*.6; p.a += p.va;
    if (p.y > H+20) parts[i] = mk(false);
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a);
    if (p.petal){ cx.fillStyle = p.col; cx.globalAlpha=.75; cx.beginPath(); cx.ellipse(0,0,p.r,p.r*.55,0,0,6.28); cx.fill(); }
    else { cx.fillStyle = p.col; cx.globalAlpha = .4+.6*Math.abs(Math.sin(t/500+p.sw)); cx.shadowColor='#f6e3a8'; cx.shadowBlur=8; cx.beginPath(); cx.arc(0,0,p.r,0,6.28); cx.fill(); }
    cx.restore();
  });
  bursts = bursts.filter(b => b.life > 0);
  bursts.forEach(b => { b.x+=b.vx; b.y+=b.vy; b.vy+=.12; b.life-=.014; cx.globalAlpha=Math.max(b.life,0); cx.fillStyle=b.col; cx.beginPath(); cx.arc(b.x,b.y,b.r,0,6.28); cx.fill(); });
  cx.globalAlpha = 1;
  requestAnimationFrame(frame);
}
if (!matchMedia('(prefers-reduced-motion:reduce)').matches) requestAnimationFrame(frame);

/* ---------- Link Generator Admin Modal Logic ---------- */
const admin = $('#admin');
function openAdmin(){ admin.classList.add('open'); }
function buildLink(){
  const name = $('#gName').value.trim();
  const m = $('#gM').checked ? '1' : '0';
  const b = $('#gB').checked ? '1' : '0';
  const w = $('#gW').checked ? '1' : '0';
  const base = location.href.split('#')[0];
  let url = base + '#';
  if (name) url += 'guest=' + encodeURIComponent(name) + '&';
  url += `m=${m}&b=${b}&w=${w}`;
  return url;
}
$('#gCopy').onclick = () => {
  const name = $('#gName').value.trim() || 'Guest';
  const link = buildLink();
  const text = `﷽\n*Mr. & Mrs. Mulazim Hussain* cordially invite you, *${name}*, to celebrate the wedding festivities of *Major Yasir Raza*.\n\n💌 *Tap here to open your invitation:*\n${link}`;
  navigator.clipboard.writeText(text);
  alert('Copied WhatsApp invite message to clipboard!');
  admin.classList.get && admin.classList.remove('open');
};
$('#gSend').onclick = () => {
  const name = $('#gName').value.trim() || 'Guest';
  const link = buildLink();
  const text = `﷽\n*Mr. & Mrs. Mulazim Hussain* cordially invite you, *${name}*, to celebrate the wedding festivities of *Major Yasir Raza*.\n\n💌 *Tap here to open your invitation:*\n${link}`;
  window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(text), '_blank');
};
$('#adminX').onclick = () => admin.classList.remove('open');

// Open admin panel with Ctrl+Shift+S or typing #admin in URL
window.addEventListener('keydown', e => {
  if (e.ctrlKey && e.shiftKey && e.key.toUpperCase() === 'S') { e.preventDefault(); openAdmin(); }
});
if (location.hash.includes('admin')) openAdmin();
</script>
